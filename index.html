<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LinkShow - Comparte todos tus links en un solo lugar">

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
        font-src 'self' https://cdnjs.cloudflare.com;
        img-src 'self' https: data:;
        connect-src 'self' https:;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
    ">

    <title>LinkShow - Tus links en un solo lugar</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Font Awesome with SRI (Subresource Integrity) -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >
</head>
<body>
    <div class="background-animation"></div>

    <div class="container">
        <!-- Profile Section -->
        <div class="profile-section">
            <div class="profile-image">
                <img src="https://via.placeholder.com/150" alt="Profile Picture" id="profileImg">
            </div>
            <h1 class="profile-name" id="profileName">Tu Nombre</h1>
            <p class="profile-bio" id="profileBio">Comparte todos tus links en un solo lugar</p>
        </div>

        <!-- Social Media Links -->
        <div class="social-links" id="socialLinks">
            <!-- Social links will be dynamically added here -->
        </div>

        <!-- Custom Links -->
        <div class="custom-links" id="customLinks">
            <!-- Custom links will be dynamically added here -->
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Hecho con <i class="fas fa-heart"></i> usando LinkShow</p>
        </footer>
    </div>

    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>

    <script src="script.js"></script>
</body>
</html>
